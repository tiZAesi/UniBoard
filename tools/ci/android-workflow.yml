# GitHub Actions 工作流：自检 + 单测 + 打 Debug APK
#
# ⚠️ 这个文件放在 tools/ci/ 而不是 .github/workflows/ 是**故意的**：
#    推送到 .github/workflows/ 需要 Personal Access Token 带 workflow scope，
#    当前推送用的令牌没有这个权限，GitHub 会直接拒绝。
#    想启用 CI，把本文件复制/移动到 .github/workflows/android.yml 即可：
#        mkdir -p .github/workflows && cp tools/ci/android-workflow.yml .github/workflows/android.yml
#        git add .github/workflows/android.yml && git commit -m "启用 CI" && git push
#    （或在 GitHub 网页上新建该文件，把下面内容粘进去。）
#
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 自检 · 单测 · 打包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 静态自检（资源引用 / 括号 / 许可证头）
        run: python3 tools/check_code.py

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: 打包 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: UniBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
